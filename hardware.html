<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can I Run It? Hardware Specs Matcher</title>
<style>
:root{--bg:#0e1320;--sf:#161c2d;--sf2:#1d2540;--ln:#2a3555;--tx:#e8ecf6;--mu:#98a4c2;--ac:#7aa2ff;
--g:#3ddc97;--y:#ffc857;--r:#ff6b6b;--gb:#3ddc9722;--yb:#ffc85722;--rb:#ff6b6b22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.1;margin:8px 0 4px;letter-spacing:-.02em}
h1 span{color:var(--ac)}
.sub{color:var(--mu);margin:0 0 20px}
h2{font-size:1rem;margin:0 0 12px;color:var(--mu);font-weight:600}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
.main{display:grid;gap:16px}
label{display:block;font-size:.85rem;color:var(--mu);margin-bottom:4px}
select,input[type=search]{width:100%;background:var(--sf2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:11px 12px;font:inherit}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.preset{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--ln)}
.srch{display:flex;gap:8px}.srch select{width:auto}.cnt{color:var(--mu);font-size:.8rem;margin:8px 0 0}
.cards{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-top:8px;max-height:420px;overflow:auto;padding-right:2px}
.card{text-align:left;background:var(--sf2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;cursor:pointer;font:inherit}
.card small{display:block;color:var(--mu);font-size:.75rem}
.card:hover{border-color:var(--ac)}
.card[aria-pressed=true]{border-color:var(--ac);background:#27335c}
.empty{color:var(--mu);grid-column:1/-1;margin:6px 0}
.badge{border-radius:14px;border:2px solid;padding:20px 18px;margin-bottom:16px}
.badge .ic{font-size:2.4rem;line-height:1}
.badge h3{margin:8px 0 4px;font-size:clamp(1.3rem,4.5vw,1.8rem);line-height:1.2}
.badge p{margin:0;color:var(--tx);opacity:.85}
.b3,.b2{border-color:var(--g);background:var(--gb);color:var(--g)}
.b1{border-color:var(--y);background:var(--yb);color:var(--y)}
.b0{border-color:var(--r);background:var(--rb);color:var(--r)}
.badge p{color:var(--tx)}
.row{padding:12px 0;border-top:1px solid var(--ln)}
.row:first-of-type{border-top:0;padding-top:0}
.rt{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.rt b{font-size:1rem}
.chip{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:99px}
.c0{background:var(--rb);color:var(--r)}.c1{background:var(--yb);color:var(--y)}.c2,.c3{background:var(--gb);color:var(--g)}
.you{color:var(--mu);font-size:.85rem;margin:2px 0 8px}
.track{position:relative;height:12px;border-radius:99px;background:var(--sf2)}
.fill{height:100%;border-radius:99px}
.f0{background:var(--r)}.f1{background:var(--y)}.f2,.f3{background:var(--g)}
.tick{position:absolute;top:-4px;width:2px;height:20px;background:var(--tx);opacity:.7}
.leg{display:flex;justify-content:space-between;color:var(--mu);font-size:.75rem;margin-top:6px;gap:8px}
.ad{border:1px dashed var(--ln);border-radius:12px;padding:14px;margin-top:8px;color:var(--mu);font-size:.9rem}
.ad .tag{font-size:.7rem;color:var(--mu);display:block;margin-bottom:6px}
.ad a{display:inline-block;margin-top:8px;background:var(--ac);color:#0e1320;font-weight:700;text-decoration:none;padding:8px 14px;border-radius:9px}
.ad strong{color:var(--tx)}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(3,1fr)}}
@media(min-width:920px){.main{grid-template-columns:420px 1fr;align-items:start}.right{position:sticky;top:16px}.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Can I Run It? <span>Hardware Specs Matcher</span></h1>
  <p class="sub">Pick your PC parts, choose a game or app, and get an instant verdict.</p>

  <div class="main">
    <div class="left">
      <section class="panel" aria-labelledby="h-spec">
        <h2 id="h-spec">Your PC</h2>
        <div class="preset"><label for="preset">Quick preset</label><select id="preset"></select></div>
        <div class="grid">
          <div><label for="cpu">CPU (processor)</label><select id="cpu"></select></div>
          <div><label for="gpu">GPU (graphics card)</label><select id="gpu"></select></div>
          <div><label for="ram">RAM</label><select id="ram"></select></div>
          <div><label for="sto">Storage type</label><select id="sto"></select></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="h-game">
        <h2 id="h-game">Game or software</h2>
        <label for="q" class="sr" style="position:absolute;left:-9999px">Search</label>
        <div class="srch"><input type="search" id="q" placeholder="Search games and apps" autocomplete="off"><label for="tf" style="position:absolute;left:-9999px">Filter by type</label><select id="tf"><option value="">All</option><option>Game</option><option>Software</option></select></div>
        <p class="cnt" id="cnt"></p>
        <div class="cards" id="cards"></div>
      </section>
    </div>

    <div class="right">
      <div id="badge" class="badge" role="status" aria-live="polite"></div>
      <section class="panel" aria-labelledby="h-bd">
        <h2 id="h-bd">Component breakdown</h2>
        <div id="rows"></div>
        <p class="leg" style="margin-top:12px"><span>White marks on each bar: minimum (left) and recommended (right).</span></p>
      </section>
      <aside class="ad" id="ad" aria-label="Sponsored recommendation"></aside>
    </div>
  </div>
</div>

GAMES.sort((a,b)=>a.n.localeCompare(b.n));

/* ---------- STATE & DOM ---------- */
const $=id=>document.getElementById(id);
let cur=GAMES.findIndex(x=>x.n==="Cyberpunk 2077");
const fill=(el,arr,fn)=>{el.innerHTML=arr.map((x,i)=>`<option value="${i}">${fn(x)}</option>`).join("")};
fillG($("cpu"),CG);fillG($("gpu"),GG);fill($("ram"),RAMS,x=>x+" GB");fill($("sto"),STOS,x=>x[0]);
fill($("preset"),PRESETS,x=>x[0]);
const LABELS=["Falls short","Meets minimum","Meets recommended","Exceeds"];

/* ---------- ENGINE ---------- */
const status=(v,min,rec)=>v<min?0:v<rec?1:v>=rec*1.4?3:2;
const stoText=s=>s>=2?"SSD":"HDD or SSD";

function calc(){
  const gm=GAMES[cur],u={c:CPUS[$("cpu").value][1],g:GPUS[$("gpu").value][1],r:RAMS[$("ram").value],s:STOS[$("sto").value][1]};
  const rows=[
   {k:"CPU",you:CPUS[$("cpu").value][0],key:"c",min:gm.min.c,rec:gm.rec.c,mt:gm.min.ct,rt:gm.rec.ct},
   {k:"GPU",you:GPUS[$("gpu").value][0],key:"g",min:gm.min.g,rec:gm.rec.g,mt:gm.min.gt,rt:gm.rec.gt},
   {k:"RAM",you:u.r+" GB",key:"r",min:gm.min.r,rec:gm.rec.r,mt:gm.min.r+" GB",rt:gm.rec.r+" GB"},
   {k:"Storage",you:STOS[$("sto").value][0],key:"s",min:gm.min.s,rec:gm.rec.s,mt:stoText(gm.min.s),rt:stoText(gm.rec.s)}
  ].map(r=>({...r,v:u[r.key],st:status(u[r.key],r.min,r.rec)}));
  const worst=Math.min(...rows.map(r=>r.st));
  render(gm,rows,Math.min(worst,2),u);
}

/* ---------- RENDER ---------- */
function render(gm,rows,lvl,u){
  const B={2:["✔","Can Run Smoothly - Recommended Specs Met","Your PC meets or beats the recommended specs for "+gm.n+"."],
           1:["⚠","Can Run on Low Settings - Minimum Specs Met","Your PC clears the minimum for "+gm.n+", but falls below recommended in: "+rows.filter(r=>r.st<2).map(r=>r.k).join(", ")+"."],
           0:["✖","Cannot Run - Upgrade Required","Below the minimum for "+gm.n+": "+rows.filter(r=>r.st===0).map(r=>r.k).join(", ")+"."]}[lvl];
  $("badge").className="badge b"+lvl;
  $("badge").innerHTML=`<div class="ic" aria-hidden="true">${B[0]}</div><h3>${B[1]}</h3><p>${B[2]}</p>`;
  $("rows").innerHTML=rows.map(r=>{
    const sc=Math.max(r.rec*1.4,r.v*1.05),pc=x=>Math.min(100,x/sc*100).toFixed(1);
    return `<div class="row"><div class="rt"><b>${r.k}</b><span class="chip c${r.st}">${LABELS[r.st]}</span></div>
    <div class="you">You: ${r.you}</div>
    <div class="track" role="img" aria-label="${r.k}: ${LABELS[r.st]}"><div class="fill f${r.st}" style="width:${pc(r.v)}%"></div><i class="tick" style="left:${pc(r.min)}%"></i><i class="tick" style="left:calc(${pc(r.rec)}% - 2px)"></i></div>
    <div class="leg"><span>Min: ${r.mt}</span><span>Rec: ${r.rt}</span></div></div>`}).join("");
  ads(gm,rows,u);
}

// Ad / affiliate slot. Replace href="#" with your affiliate links, or drop in an ad network snippet.
function ads(gm,rows,u){
  let h;
  const gpuRow=rows[1],ramRow=rows[2];
  if(gpuRow.st<2){
    const pool=GPUS.filter(x=>x[2]).sort((a,b)=>a[1]-b[1]),t=pool.find(x=>x[1]>=gm.rec.g)||pool[pool.length-1];
    h=`<strong>Recommended GPU upgrade:</strong> ${t[0]}<br>The entry-level current card in our list that reaches the recommended level for ${gm.n}.<br><a href="#" rel="sponsored noopener" target="_blank">Check price</a>`;
  }else if(ramRow.st<2){
    const t=RAMS.find(x=>x>=gm.rec.r);
    h=`<strong>Recommended RAM upgrade:</strong> ${t} GB kit<br>Gets your memory to the recommended level for ${gm.n}.<br><a href="#" rel="sponsored noopener" target="_blank">Check price</a>`;
  }else h=`<strong>Gear for ${gm.n}</strong><br>Your specs are covered. Looking for a monitor or SSD upgrade?<br><a href="#" rel="sponsored noopener" target="_blank">Browse picks</a>`;
  $("ad").innerHTML=`<span class="tag">Sponsored</span>${h}`;
}

function cards(){
  const q=$("q").value.trim().toLowerCase();
  const tf=$("tf").value;
  const list=GAMES.map((x,i)=>[x,i]).filter(([x])=>(!tf||x.t===tf)&&x.n.toLowerCase().includes(q));
  $("cnt").textContent=list.length+" of "+GAMES.length+" titles";
  $("cards").innerHTML=list.length?list.map(([x,i])=>`<button class="card" data-i="${i}" aria-pressed="${i===cur}">${x.n}<small>${x.t}</small></button>`).join(""):`<p class="empty">No match. Try another name.</p>`;
}

/* ---------- EVENTS ---------- */
$("cards").addEventListener("click",e=>{const b=e.target.closest(".card");if(!b)return;cur=+b.dataset.i;cards();calc()});
$("q").addEventListener("input",cards);
$("tf").addEventListener("change",cards);
["cpu","gpu","ram","sto"].forEach(id=>$(id).addEventListener("change",()=>{$("preset").value=0;calc()}));
$("preset").addEventListener("change",e=>{
  const p=PRESETS[e.target.value][1];if(!p)return;
  $("cpu").value=CPUS.findIndex(x=>x[0]===p[0]);$("gpu").value=GPUS.findIndex(x=>x[0]===p[1]);$("ram").value=RAMS.indexOf(p[2]);$("sto").value=p[3];calc();
});

/* ---------- INIT ---------- */
$("preset").value=3;$("preset").dispatchEvent(new Event("change"));cards();calc();
</script>
